          <article class="manuscript-card">
            <p class="eyebrow">第 ${p.chapter + 1} 章 · ${esc(chapters[p.chapter])} · 第 ${n(p.id)} 页</p>
            <h2>${esc(p.title)}</h2>

            <!-- Block 1: Goal -->
            ${renderAnnotatableBlock(`${p.id}-goal`, '核心目标与论点', `
              <p class="lead-text" style="margin-bottom: 0;">${esc(p.goal)}</p>

            <div class="points-grid" style="margin-top: 24px;">
              ${renderAnnotatableBlock(`${p.id}-point1`, '要点 01 · 明确业务目标', `

              `)}
              ${renderAnnotatableBlock(`${p.id}-point3`, '要点 03 · 形成执行要求', `
                <h4>03 · 形成执行要求</h4>
                <p>明确页面焦点与呈现关系，为后续原图生成和排版工具提供确定性的输入。</p>
              `)}
              ${renderAnnotatableBlock(`${p.id}-point4`, '要点 04 · 比较后再采用', `
                <h4>04 · 比较后再采用</h4>
                <p>返回结果作为独立候选展示，通过并排比对确认无偏离后，再升级为新当前版本。</p>
              `)}
            </div>

            <h3 style="margin-top: 28px;">正文讲述与陈述重点</h3>
            ${renderAnnotatableBlock(`${p.id}-body`, '正文讲述与陈述重点', `
              <p style="font-size: 14px; line-height: 1.8; color: #334155; margin-top: 6px; margin-bottom: 0;">
                ${esc(p.body)}
              </p>
            `)}

            <div class="row between" style="margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--dm-color-border-subtle);">
              <div class="row" style="gap: 8px;">
                <button class="button tiny" data-panel="note">${I('note')}记录本页调整意见</button>
                <button class="button tiny quiet" data-action="start-add-comment" data-block-id="${p.id}-body">${I('comment')}添加段落批注</button>
              </div>
              <button class="button tiny primary" data-action="prep-requirements">${I('file')}准备制作要求</button>
            </div>
          </article>
        ` : `
          <!-- 16:9 Canvas View -->
          <div style="background: var(--dm-color-surface); border: 1px solid var(--dm-color-border); border-radius: var(--dm-radius-panel); padding: 32px 36px; box-shadow: var(--dm-elevation-canvas);">
            ${renderCanvasToolbar()}
            <div class="slide-canvas" style="aspect-ratio: 16 / 9; padding: 36px; border-radius: 8px; position: relative;">
              ${renderCanvasGuides()}
              <div class="canvas-head">
                <span>企业内容运营方案 · 第 ${n(p.id)} 页</span>
                <span>${esc(chapters[p.chapter])}</span>
              </div>
              <div style="margin: 32px 0;">
                <h2 style="font-size: 27px; line-height: 1.35; margin-bottom: 14px;">${esc(p.title)}</h2>
                <p style="font-size: 15px; line-height: 1.7; color: var(--dm-color-text-secondary);">${esc(p.goal)}</p>
              </div>
              <div class="canvas-cols">
                <div>目标聚焦</div>
                <div>来源依据</div>
                <div>结果流转</div>
              </div>
            </div>
          </div>
        `}
      </section>

      <!-- Non-modal Side Fact & Source Rail -->
      <aside class="side-fact-rail">
        <div class="fact-card">
          <h3>本页关联事实与依据</h3>
          <strong>业务需求访谈纪要 §2</strong>
          <blockquote>
            “内容确认之后，设计和制作仍会反复沟通相同要求。希望每一次修改都能明确依据与受影响的页面范围。”
          </blockquote>
          <button class="button tiny" data-open-source="${p.id}" style="width: 100%; margin-top: 10px;">${I('file')}展开完整依据</button>
        </div>

        <div class="fact-card">
          <h3>本页制作产物进度</h3>
          <div style="display: flex; flex-direction: column; gap: 10px; font-size: 13px; margin-top: 10px;">
            <div class="row between">
              <span>逐页稿</span>
              ${p.review ? '<span class="badge warn">待确认</span>' : '<span class="badge ok">已确认</span>'}

            <div class="row between">
              <span>原图生成</span>
              ${p.candidate ? '<span class="badge warn pulse">候选待比对</span>' : p.original ? '<span class="badge ok">已采用</span>' : '<span class="muted">未制作</span>'}

  `;

          </div>

          <!-- Quick presets & hint under the curtain slider -->
          <div class="row between" style="margin-top: 12px; font-size: 12px; color: var(--dm-color-text-muted); flex-wrap: wrap; gap: 8px;">

        </div>

      <!-- Decision Action Bar -->
      <div class="decision-action-bar">

          </p>
        </div>
        <div class="row">
          <button class="button" data-action="keep-current-version" ${candidateDiffData.status!=='pending'?'disabled':''}>
            ${I('close')}保留当前基准 R 08
          </button>
          <button class="primary" data-action="adopt-candidate-version" ${candidateDiffData.status!=='pending'?'disabled':''}>
            ${I('check')}采用此候选 (升级为 R 09)
          </button>
        </div>
      </div>
    </div>
  `;
}

/* ==========================================================================
   Master Render Workspace Function
   ========================================================================== */
function renderWorkspace() {
  const mount = document.getElementById('workspace-mount');
  switch (state.scene) {
    case 'projects': mount.innerHTML = renderProjects(); break;
    case 'overview': mount.innerHTML = renderOverview(); break;
    case 'content': mount.innerHTML = renderContent(); break;
    case 'gallery': mount.innerHTML = renderGallery(); break;
    case 'style': mount.innerHTML = renderStyle(); break;
    case 'delivery': mount.innerHTML = renderDelivery(); break;
    case 'page': mount.innerHTML = renderPage(); break;
    case 'compare': 
      mount.innerHTML = renderCompare(); 
      if (state.compareMode === 'curtain') {
        requestAnimationFrame(syncCurtainInnerWidth);
      }
      break;
    default: mount.innerHTML = renderOverview(); break;
  }
}

        <li><strong>S07 候选比对升级：</strong>支持「并排比对 (Side-by-Side)」与「卷帘滑块透视 (Split Slider)」双模式，无缝拖拽透视新旧排版差异。</li>
        <li><strong>严禁纯文字 button 铁律：</strong>全界面 100% 按钮均配有表达操作语义的矢量图标，无任何遗漏。</li>
        <li><strong>官方 C-refined-v1 紧凑标志：</strong>页眉嵌入官方 20×20 精确几何路径标志，绝对像素对齐。</li>
        <li><strong>CJK 排印与字阶纪律：</strong>中文标题行高严格锁定 1.35–1.4，正文行高 1.7–1.8，英文大写标签增加 0.06em–0.08em 字间距。</li>
      </ul>
    `;
    foot = `<button class="button" data-action="close-drawer">${I('close')}了解并返回</button>`;
  } else {
    title = '信息面板';
    body = '<p>操作已记录在当前原型会话中。</p>';
    foot = `<button class="button" data-action="close-drawer">${I('close')}关闭</button>`;
  }

  mount.innerHTML = `
    <div class="drawer-backdrop" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-panel ${state.editorWide?'wide':''}">
        <header class="drawer-head">
          <h2 id="drawer-title" style="font-size: 16px;">${title}</h2>
          <button class="button icon-only quiet" data-action="close-drawer" aria-label="关闭抽屉">${I('close')}</button>
        </header>
        <div class="drawer-body">${body}</div>
        <footer class="drawer-foot">${foot}</footer>
      </div>
    </div>
  `;
}

function closeDrawer() {
  state.drawer = null;
  document.getElementById('drawer-mount').innerHTML = '';
}

/* ==========================================================================
   Command Spotlight Modal (⌘K Search Center)
   ========================================================================== */
function openSpotlight() {
  state.spotlightOpen = true;
  state.spotlightQuery = '';
  renderSpotlight();
}

function closeSpotlight() {
  state.spotlightOpen = false;
  document.getElementById('spotlight-mount').innerHTML = '';
}

function renderSpotlight() {
  const mount = document.getElementById('spotlight-mount');
  if (!state.spotlightOpen) {
    mount.innerHTML = '';
    return;
  }

  const q = state.spotlightQuery.toLowerCase().trim();
  const allActions = [
    { type: 'scene', id: 'overview', title: '制作总览', desc: '查看全局生产进度与推荐动作', icon: 'overview' },
    { type: 'scene', id: 'content', title: '内容与页序', desc: '管理 30 页论证结构与章节', icon: 'content' },
    { type: 'scene', id: 'gallery', title: '整稿画廊', desc: '16:9 画板网格与连续长卷浏览', icon: 'gallery' },
    { type: 'scene', id: 'style', title: '风格校准', desc: '视觉 Token 与 4 阶段试作校准', icon: 'style' },
    { type: 'scene', id: 'delivery', title: '任务与交付', desc: '四大业务分区与审阅包导出', icon: 'delivery' },
    { type: 'scene', id: 'compare', title: '候选比较', desc: '比对第 13 页原图与正文候选', icon: 'compare' },
    { type: 'scene', id: 'projects', title: '所有项目', desc: '项目矩阵与本地目录切换', icon: 'projects' },
    { type: 'action', id: 'toggle-theme', title: '切换工作区质感 (工作室 / 暗室)', desc: '在 Studio Light 与 Pro Darkroom 间切换', icon: 'sparkles' },
    { type: 'action', id: 'new-project', title: '新建项目', desc: '创建新的商业表达方案', icon: 'plus' },
    { type: 'action', id: 'export-review-pkg', title: '导出审阅包', desc: '生成当前逐页稿审阅 ZIP', icon: 'download' }
  ];

  const matchedPages = pages.filter(p => !q || p.title.toLowerCase().includes(q) || String(p.id) === q).slice(0, 5);
  const matchedActions = allActions.filter(a => !q || a.title.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q));

  mount.innerHTML = `
    <div class="drawer-backdrop" data-action="close-spotlight" style="justify-content: center; align-items: flex-start;">
      <div class="spotlight-modal" onclick="event.stopPropagation()">
        <div class="spotlight-input-wrap">
          ${I('search')}
          <input type="text" id="spotlight-input" placeholder="输入页名、编号或工作面..." value="${esc(state.spotlightQuery)}" autofocus aria-label="全局快速查找">
          <kbd class="dm-kbd">ESC</kbd>
        </div>
        <div class="spotlight-list">
          <div style="padding: 6px 12px; font-size: 11px; color: var(--dm-color-text-muted); text-transform: uppercase; letter-spacing: 0.06em;">工作面与动作</div>
          ${matchedActions.map(a => `
            <div class="spotlight-item" data-spotlight-action="${a.type}" data-target="${a.id}">
              <div class="row">
                ${I(a.icon)}
                <strong>${esc(a.title)}</strong>
              </div>
              <small>${esc(a.desc)}</small>
            </div>
          `).join('')}

          ${matchedPages.length ? `
            <div style="padding: 10px 12px 6px; font-size: 11px; color: var(--dm-color-text-muted); text-transform: uppercase; letter-spacing: 0.06em;">页面直达</div>
            ${matchedPages.map(p => `
              <div class="spotlight-item" data-spotlight-page="${p.id}">
                <div class="row">
                  <span class="p-no num" style="font-size: 12px; color: var(--dm-color-text-muted); min-width: 20px;">${n(p.id)}</span>
                  ${I('page')}
                  <span>${esc(p.title)}</span>
                </div>
                <small>第 ${p.chapter + 1} 章</small>
              </div>
            `).join('')}
          ` : ''}
        </div>
      </div>
    </div>
  `;

  const input = document.getElementById('spotlight-input');
  if (input) {
    input.focus();
    input.selectionStart = input.selectionEnd = input.value.length;
    input.addEventListener('input', e => {
      state.spotlightQuery = e.target.value;
      renderSpotlight();
    });
  }
}

/* ==========================================================================
   Page Order & State Actions
   ========================================================================== */
function movePage(id, direction) {
  const p = P(id);
  const curIdx = state.order.indexOf(p.id);
  const targetIdx = curIdx + direction;
  if (targetIdx < 0 || targetIdx >= state.order.length) return;
  
  const targetPage = P(state.order[targetIdx]);
  if (targetPage.chapter !== p.chapter) return;
  
  [state.order[curIdx], state.order[targetIdx]] = [state.order[targetIdx], state.order[curIdx]];
  state.orderDirty = state.order.some((x, i) => x !== state.savedOrder[i]);
  renderWorkspace();
  notify(`已将第 ${curIdx+1} 页调整为第 ${targetIdx+1} 页`);
}

/* ==========================================================================
   Global Event Handlers & Delegation
   ========================================================================== */
document.addEventListener('click', e => {
  const btn = e.target.closest('button, a, div[data-action], .spotlight-item, .slide-card');
  if (!btn) return;

  // Spotlight delegation
  if (btn.dataset.action === 'open-spotlight') {
    openSpotlight();
    return;
  }
  if (btn.dataset.action === 'close-spotlight') {
    closeSpotlight();
    return;
  }
  if (btn.dataset.spotlightAction) {
    const type = btn.dataset.spotlightAction;
    const target = btn.dataset.target;
    closeSpotlight();
    if (type === 'scene') setScene(target);
    else if (target === 'new-project') notify('进入短流程新建项目：任务说明 → 关联材料 → 保存位置 (演示)');
    else if (target === 'export-review-pkg') notify('已生成审阅包：企业内容运营方案_R08_Review.zip');
    return;
  }
  if (btn.dataset.spotlightPage) {
    const id = Number(btn.dataset.spotlightPage);
    closeSpotlight();
    openPage(id);
    return;
  }

  // Presentation Mode Actions
  if (btn.dataset.action === 'start-presentation') {
    e.preventDefault();
    const pid = btn.dataset.page ? Number(btn.dataset.page) : state.currentPage;
    startPresentation(pid);
    return;
  }
  if (btn.dataset.action === 'exit-presentation') {
    e.preventDefault();
    exitPresentation();
    return;
  }
  if (btn.dataset.action === 'pres-next') {
    e.preventDefault();
    presNext();
    return;
  }
  if (btn.dataset.action === 'pres-prev') {
    e.preventDefault();
    presPrev();
    return;
  }
  if (btn.dataset.action === 'pres-goto-page') {
    e.preventDefault();
    setPresentationPage(Number(btn.dataset.page));
    return;
  }
  if (btn.dataset.action === 'toggle-pres-thumbnails') {
    e.preventDefault();
    togglePresentationThumbnails();
    return;
  }
  if (btn.dataset.action === 'toggle-pres-autoplay') {
    e.preventDefault();
    togglePresentationAutoPlay();
    return;
  }
  if (btn.dataset.action === 'set-pres-layer') {
    e.preventDefault();
    state.presentation.layer = btn.dataset.layer;
    renderPresentation();
    return;
  }
  if (btn.dataset.action === 'toggle-native-fullscreen') {
    e.preventDefault();
    toggleNativeFullscreen();
    return;
  }
  if (btn.dataset.action === 'pres-open-editor') {
    e.preventDefault();
    const pid = Number(btn.dataset.page);
    exitPresentation();
    openPage(pid);
    openDrawer('editor', { id: pid });
    return;
  }

  // Annotation & Review Bubble Actions
  if (btn.dataset.action === 'toggle-comment-bubble' || btn.dataset.action === 'start-add-comment') {
    e.preventDefault();
    const bId = btn.dataset.blockId;
    state.activeCommentBlock = (state.activeCommentBlock === bId && btn.dataset.action === 'toggle-comment-bubble') ? null : bId;
    renderWorkspace();
    return;
  }
  if (btn.dataset.action === 'close-comment-bubble') {
    e.preventDefault();
    state.activeCommentBlock = null;
    renderWorkspace();
    return;
  }
  if (btn.dataset.action === 'submit-comment') {
    e.preventDefault();
    const bId = btn.dataset.blockId;
    const txtEl = document.getElementById(`new-comment-textarea-${bId}`);
    const roleEl = document.getElementById(`new-comment-role-${bId}`);
    if (txtEl && txtEl.value.trim()) {
      const parts = (roleEl ? roleEl.value : '业务架构师|李凡').split('|');
      const role = parts[0] || '业务架构师';
      const author = parts[1] || '李凡';
      if (!state.annotations[bId]) state.annotations[bId] = [];
      state.annotations[bId].push({
        id: 'c-' + Date.now(),
        author,
        role,
        time: '刚刚',
        text: txtEl.value.trim(),
        status: 'pending',
        suggestedText: '',
        replies: []
      });
      renderWorkspace();
      notify('已发表段落审阅批注！');
    } else {
      notify('请输入批注内容');
    }
    return;
  }
  if (btn.dataset.action === 'adopt-comment') {
    e.preventDefault();
    const cid = btn.dataset.cid;
    const bId = btn.dataset.blockId;
    const comments = state.annotations[bId] || [];
    const target = comments.find(c => c.id === cid);
    if (target && target.suggestedText) {
      target.status = 'adopted';
      const page = P(state.currentPage);
      if (bId.includes('goal')) {
        page.goal = target.suggestedText;
      } else if (bId.includes('body')) {
        page.body = target.suggestedText;
      }
      renderWorkspace();
      notify('已采纳修改建议并更新正文！');
    }
    return;
  }
  if (btn.dataset.action === 'toggle-resolve-comment') {
    e.preventDefault();
    const cid = btn.dataset.cid;
    const bId = btn.dataset.blockId;
    const comments = state.annotations[bId] || [];
    const target = comments.find(c => c.id === cid);
    if (target) {
      target.status = target.status === 'resolved' ? 'pending' : 'resolved';
      renderWorkspace();
      notify(target.status === 'resolved' ? '已标记为已解决' : '已重新激活为待处理状态');
    }
    return;
  }
  if (btn.dataset.action === 'delete-comment') {
    e.preventDefault();
    const cid = btn.dataset.cid;
    const bId = btn.dataset.blockId;
    if (state.annotations[bId]) {
      state.annotations[bId] = state.annotations[bId].filter(c => c.id !== cid);
      renderWorkspace();
      notify('批注已删除');
    }
    return;
  }
  if (btn.dataset.action === 'apply-comment-to-drawer') {
    e.preventDefault();
    openDrawer('editor', { id: state.currentPage });
    return;
  }
  if (btn.dataset.action === 'jump-to-comment') {
    e.preventDefault();
    const bId = btn.dataset.blockId;
    state.activeCommentBlock = bId;
    renderWorkspace();
    setTimeout(() => {
      const targetEl = document.querySelector(`[data-block-id="${bId}"]`);
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: motionPref(), block: 'center' });
      }
    }, 50);
    return;
  }
  if (btn.dataset.action === 'toggle-page-comments-rail') {
    e.preventDefault();
    const card = document.querySelector('.review-summary-card');
    if (card) {
      card.scrollIntoView({ behavior: motionPref(), block: 'center' });
      notify('已定位至右侧审阅与批注面板');
    }
    return;
  }

  // Scene navigation
  if (btn.dataset.go) {
    e.preventDefault();
    setScene(btn.dataset.go);
    return;
  }

  // Open Page
  if (btn.dataset.openPage) {
    e.preventDefault();
    openPage(btn.dataset.openPage);
    return;
  }

  // Open Compare
  if (btn.dataset.openCompare) {
    e.preventDefault();
    openCompare(btn.dataset.openCompare);
    return;
  }

  // Open Source
  if (btn.dataset.openSource) {
    e.preventDefault();
    openDrawer('source', { id: btn.dataset.openSource });
    return;
  }

  // Content Tabs
  if (btn.dataset.tab) {
    state.contentTab = btn.dataset.tab;
    renderWorkspace();
    return;
  }

  // Chapter filter in S02
  if (btn.dataset.chapter !== undefined) {
    state.chapterFilter = Number(btn.dataset.chapter);
    renderWorkspace();
    return;
  }

  // Gallery view mode
  if (btn.dataset.galleryMode) {
    state.galleryView = btn.dataset.galleryMode;
    renderWorkspace();
    return;
  }

  // Page View (Read / Preview)
  if (btn.dataset.pageView) {
    state.pageView = btn.dataset.pageView;
    renderWorkspace();
    return;
  }

  // Page Layer
  if (btn.dataset.pageLayer) {
    state.pageLayer = btn.dataset.pageLayer;
    renderWorkspace();
    return;
  }

  // Theme Toggle
  if (btn.dataset.action === 'toggle-theme') {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    notify(state.theme === 'dark' ? '已切换至 Pro Darkroom 暗室沉浸放映质感' : '已切换至 Studio Light 工作室明亮质感');
    return;
  }

  // Canvas Guides Toggle
  if (btn.dataset.action === 'toggle-guide') {
    const g = btn.dataset.guide;
    if (state.canvasGuides[g] !== undefined) {
      state.canvasGuides[g] = !state.canvasGuides[g];
      renderWorkspace();
      const names = { safeArea: '80% 安全区框线', thirds: '三分法构图网格', grid: '12列版心标尺' };
      notify(`已${state.canvasGuides[g] ? '开启' : '关闭'}${names[g] || '参考线'}`);
    }
    return;
  }

  // Compare View Mode Switcher
  if (btn.dataset.action === 'set-compare-mode') {
    state.compareMode = btn.dataset.mode;
    renderWorkspace();
    return;
  }

  // Curtain Preset Buttons
  if (btn.dataset.action === 'set-curtain-preset') {
    state.compareCurtainPos = Number(btn.dataset.pos);
    renderWorkspace();
    return;
  }

  // Move page row
  if (btn.dataset.move) {
    movePage(Number(btn.dataset.move), Number(btn.dataset.dir));
    return;
  }

  // Rename page
  if (btn.dataset.rename) {
    openDrawer('rename', { id: btn.dataset.rename });
    return;
  }

  // Open Drawer panels
  if (btn.dataset.panel) {
    openDrawer(btn.dataset.panel);
    return;
  }

  // General Action attributes
  if (btn.dataset.action) {
    const act = btn.dataset.action;
    if (act === 'close-drawer') {
      closeDrawer();
      return;
    }
    if (act === 'edit-page-content') {
      openDrawer('editor', { id: btn.dataset.id });
      return;
    }
    if (act === 'toggle-editor-width') {
      state.editorWide = !state.editorWide;
      openDrawer('editor', { id: state.currentPage });
      return;
    }
    if (act === 'save-editor-content') {
      const page = P(btn.dataset.id);
      const titleInput = document.getElementById('edit-title-input');
      const goalInput = document.getElementById('edit-goal-input');
      const bodyInput = document.getElementById('edit-body-textarea');
      if (titleInput && titleInput.value.trim()) page.title = titleInput.value.trim();
      if (goalInput) page.goal = goalInput.value.trim();
      if (bodyInput) page.body = bodyInput.value.trim();
      closeDrawer();
      renderWorkspace();
      notify('正文修改已成功保存至当前样页。');
      return;
    }
    if (act === 'save-rename') {
      const input = document.getElementById('rename-input');
      if (input && input.value.trim()) {
        P(btn.dataset.id).title = input.value.trim();
        closeDrawer();
        renderWorkspace();
        notify('页名修改已应用。');
      }
      return;
    }
    if (act === 'apply-order') {
      state.savedOrder = [...state.order];
      state.orderDirty = false;
      closeDrawer();
      renderWorkspace();
      notify('页序调整已应用到样页。');
      return;
    }
    if (act === 'undo-order') {
      state.order = [...state.savedOrder];
      state.orderDirty = false;
      renderWorkspace();
      notify('已撤销本次页序调整。');
      return;
    }
    if (act === 'clear-selection') {
      state.selected.clear();
      renderWorkspace();
      return;
    }
    if (act === 'prev-page') {
      const curIdx = state.order.indexOf(state.currentPage);
      if (curIdx > 0) openPage(state.order[curIdx - 1]);
      return;
    }
    if (act === 'next-page') {
      const curIdx = state.order.indexOf(state.currentPage);
      if (curIdx < state.order.length - 1) openPage(state.order[curIdx + 1]);
      return;
    }
    if (act === 'adopt-candidate-version') {
      candidateDiffData.status = 'adopted';
      const p = P(candidateDiffData.pageId);
      p.title = '把一次创作转化为可持续复用的企业生产闭环';
      p.body = candidateDiffData.candidateText;
      p.candidate = false;
      p.original = true;
      state.revision = 9;
      document.getElementById('top-revision-badge').textContent = '基准 R 09';
      renderWorkspace();
      notify('已采用候选 C 02！基准已自动升级为 R 09。');
      return;
    }
    if (act === 'keep-current-version') {
      candidateDiffData.status = 'kept';
      renderWorkspace();
      notify('已决定保留当前基准 R 08，候选已归档。');
      return;
    }
    if (act === 'prep-requirements') {
      notify('已根据当前逐页稿与规范整理好制作要求，准备进入生成流水。');
      return;
    }
    if (act === 'export-review-pkg' || act === 'download-review-pkg') {
      notify('已生成审阅包：企业内容运营方案_R08_Review.zip');
      return;
    }
    if (act === 'download-eng-pkg') {
      notify('已导出工程恢复数据快照 deck-master-snapshot-r08.json');
      return;
    }
    if (act === 'resume-reading') {
      openPage(16);
      return;
    }
    if (act === 'filter-review') {
      state.filter = 'review';
      state.scene = 'overview';
      renderWorkspace();
      return;
    }
    if (act === 'filter-svg') {
      state.filter = 'svg-ready';
      state.scene = 'overview';
      renderWorkspace();
      return;
    }
    if (act === 'switch-project') {
      state.activeProject = btn.dataset.name;
      document.getElementById('sidebar-project-title').textContent = btn.dataset.name;
      document.getElementById('crumb-project-name').textContent = btn.dataset.name;
      setScene('overview');
      notify('已切换当前工作项目至：' + btn.dataset.name);
      return;
    }
    if (act === 'new-project') {
      notify('进入短流程新建项目：任务说明 → 关联材料 → 保存位置 (演示环境)');
      return;
    }
    if (act === 'open-folder') {
      notify('已触发系统文件夹选择器 (演示环境已连接本地目录)');
      return;
    }
    if (act === 'relocate-project') {
      notify('已重新核对本地文件系统路径，目录尚未就绪。');
      return;
    }
    if (act === 'remove-project-record') {
      btn.closest('.project-box').remove();
      notify('已从历史记录中移除该项目条目。');
      return;
    }
    if (act === 'save-page-note') {
      const page = P(btn.dataset.id);
      const noteInput = document.getElementById('page-note-input');
      if (noteInput) state.notes[page.id] = noteInput.value.trim();
      closeDrawer();
      notify('本页调整意见草稿已保存。');
      return;
    }
    if (act === 'view-version-r7') {
      notify('已读取历史快照 R 07 (2026-10-22 17:30 只读视图)');
      return;
    }
    if (act === 'view-version-r6') {
      notify('已读取初始大纲快照 R 06 (2026-10-21 14:15 只读视图)');
      return;
    }
    if (act === 'start-svg-convert') {
      notify('已将第 09–12 页加入 SVG 矢量化流水队列。');
      return;
    }
    if (act === 'run-calibration-trial') {
      state.stylePhase = 3;
      renderWorkspace();
      notify('已发起第 04 与第 16 页的视觉试作，进入第 3 阶段！');
      return;
    }
    if (act === 'batch-source') {
      openDrawer('source');
      return;
    }
  }

  // Chapter view from S02 Chapters tab
  if (btn.dataset.chapterView !== undefined) {
    state.chapterFilter = Number(btn.dataset.chapterView);
    state.contentTab = 'structure';
    renderWorkspace();
    notify(`已筛选至第 ${state.chapterFilter + 1} 章 6 页逐页稿`);
    return;
  }
});

// Checkbox selection delegation
document.addEventListener('change', e => {
  if (e.target.dataset.select) {
    const id = Number(e.target.dataset.select);
    if (e.target.checked) state.selected.add(id);
    else state.selected.delete(id);
    renderWorkspace();
  }
  if (e.target.id === 'matrix-filter') {
    state.filter = e.target.value;
    renderWorkspace();
  }
  if (e.target.id === 'gallery-layer-select') {
    state.galleryLayer = e.target.value;
    renderWorkspace();
  }
});

// Input search & slider delegation
document.addEventListener('input', e => {
  if (e.target.id === 'matrix-search' || e.target.id === 'content-search') {
    state.query = e.target.value;
    renderWorkspace();
  }
  if (e.target.dataset.action === 'curtain-slider-input') {
    state.compareCurtainPos = Number(e.target.value);
    const bm = document.querySelector('.curtain-layer.benchmark');
    const hd = document.querySelector('.curtain-divider-handle');
    const posTag = document.getElementById('curtain-pos-val');
    if (bm) bm.style.width = state.compareCurtainPos + '%';
    if (hd) hd.style.left = state.compareCurtainPos + '%';
    if (posTag) posTag.textContent = state.compareCurtainPos + '%';
  }
});

// Global Keyboard Shortcuts (⌘K for Spotlight, Escape for drawer/modal, Alt+Up/Down for ordering)
document.addEventListener('keydown', e => {
  // Gallery cards are focusable articles; honour the Enter/Space contract they advertise
  if ((e.key === 'Enter' || e.key === ' ') && e.target instanceof Element && e.target.classList.contains('slide-card')) {
    e.preventDefault();
    openPage(e.target.dataset.openPage);
    return;
  }
  // Handle keyboard shortcuts when presentation is open
  if (state.presentation.open) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault();
      presNext();
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      presPrev();
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      exitPresentation();
      return;
    }
    if (e.key.toLowerCase() === 't') {
      e.preventDefault();
      togglePresentationThumbnails();
      return;
    }
    if (e.key.toLowerCase() === 'p') {
      e.preventDefault();
      togglePresentationAutoPlay();
      return;
    }
    return;
  }

  // When presentation is not open, P starts presentation mode on gallery or page
  if (!e.metaKey && !e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'p' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    if (state.scene === 'gallery' || state.scene === 'page') {
      e.preventDefault();
      startPresentation(state.currentPage || 1);
      return;
    }
  }

  // Command+K / Ctrl+K
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (state.spotlightOpen) closeSpotlight();
    else openSpotlight();
    return;
  }

  // Escape to close drawers or spotlight
  if (e.key === 'Escape') {
    if (state.spotlightOpen) {
      e.preventDefault();
      closeSpotlight();
      return;
    }
    if (state.drawer) {
      e.preventDefault();
      closeDrawer();
      return;
    }
  }

  // Alt + ArrowUp / ArrowDown for moving rows in S02
  if (e.altKey && ['ArrowUp', 'ArrowDown'].includes(e.key)) {
    const row = document.activeElement.closest?.('.page-item-row');
    if (row) {
      e.preventDefault();
      const id = Number(row.id.replace('row-', ''));
      movePage(id, e.key === 'ArrowUp' ? -1 : 1);
    }
  }
});

// Initial application boot
applyTheme();
setScene('overview');
</script>
</body>
</html>
