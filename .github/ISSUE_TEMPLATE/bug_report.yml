name: Bug / 故障
description: 运行失败、行为异常或升级回归
title: '[bug] '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 请先搜索已有 open / closed Issues，重复问题请补充到原讨论。所有反馈公开可见；只提供脱敏的最小例子，不上传客户原稿、密钥、绝对路径或完整私有日志。安全疑虑请先阅读 [安全政策](https://github.com/MainQuestAI/Deck-Master/blob/main/SECURITY.md)，不要在这里披露漏洞细节。无法提供的信息请写“未知 / 无法提供”并说明原因，不要猜测。
- type: textarea
  id: problem
  attributes:
    label: 现象、期望与影响
    description: 说明实际行为、期望行为、阻塞的任务及是否有绕过方式。
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 版本与环境
    description: Deck Master 版本/安装来源，OS、Python、Host 及版本、模型与相关设置（如 reasoning effort；未知可说明）。不填账号或凭据。
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: 最小脱敏复现
    description: 按顺序描述操作和中性示例输入；例如两页虚构材料，导出 review 时出现错误。无需客户项目；不能复现请说明。
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: 复现频率与升级回归
    description: 每次 / 偶发 / 仅一次？是否升级后出现，最后正常与首次异常版本（未知也可）？
  validations:
    required: false
- type: textarea
  id: evidence
  attributes:
    label: 可选诊断摘录
    description: 仅贴相关错误码与脱敏片段。可参考 deck-master doctor --step render 或 deck-master capabilities 的相关字段；不要求完整日志。
  validations:
    required: false
