name: Rebuilt Core Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: read

concurrency:
  group: deck-master-rebuild-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      legacy: ${{ steps.scope.outputs.legacy }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select legacy checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            git fetch --no-tags --depth=1 origin "$BASE" "$HEAD"
          fi
          python - <<'PY'
          import json
          import os
          import subprocess

          full = os.environ["EVENT"] in {"schedule", "workflow_dispatch"}
          legacy = full
          if not full:
              paths = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z",
                  os.environ["BASE"], os.environ["HEAD"],
              ]).decode().split("\0")
              separate = ("rust/", "deck-tools/", "deck-skill/", "docs/specs/rust-rebuild/")
              legacy = any(path and path != ".github/workflows/rust.yml"
                           and not path.startswith(separate) for path in paths)
          matrix = {"python-version": ["3.11", "3.12"] if full else ["3.12"],
                    "node-version": ["22", "24"] if full else ["22"]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"legacy={str(legacy).lower()}", file=output)
              print("matrix=" + json.dumps(matrix), file=output)
          PY

  unit:
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    name: Unit (Python ${{ matrix.python-version }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixed RC3 writer compatibility baseline
        run: git fetch --no-tags --depth=1 origin a08bc68c1cbbbc806205104c2bb01f3f096305f0
      - name: Fetch fixed historical installation journal baselines
        run: git fetch --no-tags --depth=1 origin bc6bd55a07b249660e6af8ab4b19a147bb2caf14 001c8f101e07cab1b230e0745a6f0b17fb54882e
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install build backend
        run: python -m pip install --quiet "setuptools>=77" wheel
      - name: Install rebuilt core with dev dependencies
        run: python -m pip install --quiet -e ".[dev]"
      - name: Ruff (rebuilt core and its tests)
        run: python -m ruff check src/deck_master tests/rebuild
      - name: Unit suite (browser and renderer have separate gates)
        run: python -m pytest -q tests/rebuild -m "not render and not browser" --basetemp="$RUNNER_TEMP/legacy-unit"

  render:
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    name: Real rendering chain (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y librsvg2-bin libreoffice poppler-utils fonts-dejavu fonts-noto-cjk
      - name: Install build backend
        run: python -m pip install --quiet "setuptools>=77" wheel
      - name: Install rebuilt core with dev dependencies
        run: python -m pip install --quiet -e ".[dev]"
      - name: Renderer-dependent tests
        run: python -m pytest -q tests/rebuild -m render --basetemp="$RUNNER_TEMP/legacy-render"

  browser:
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    name: Required browser and installed UI (Python 3.12, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install toolchain for the installed export fixture
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y librsvg2-bin libreoffice poppler-utils fonts-dejavu fonts-noto-cjk
      - name: Install build backend
        run: python -m pip install --quiet "setuptools>=77" wheel
      - name: Install rebuilt core with dev dependencies
        run: python -m pip install --quiet -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Required production design regressions (skips fail)
        run: python -m pytest -q tests/rebuild -m browser --require-browser --basetemp="$RUNNER_TEMP/legacy-browser"
      - name: Build and install the wheel (no editable resource borrowing)
        run: |
          python -m pip wheel --no-deps --no-build-isolation -w /tmp/workbench-wheel .
          python -m pip uninstall -y deck-master
          python -m pip install --no-deps /tmp/workbench-wheel/deck_master-*.whl
      - name: Offline installed UI and fixed-version downloads
        run: python examples/workbench/w12_offline_browser.py --require-installed --font 'DejaVu Sans' --out /tmp/workbench-browser
      - name: Installed recovery boundaries (runtime paths audited)
        env:
          STUDIO_MOBILE_CLICK_DIAGNOSTICS: /tmp/workbench-browser/mobile-gallery-click
        run: python examples/workbench/w12_installed_regressions.py --out /tmp/workbench-browser/installed-regressions.json
      - name: Preserve installed UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-browser
          path: /tmp/workbench-browser
          if-no-files-found: warn

  report:
    name: Group report
    runs-on: ubuntu-latest
    needs: [changes, unit, render, browser]
    if: always()
    steps:
      - name: Summarise group outcomes
        env:
          SCOPE: ${{ needs.changes.result }}
          LEGACY: ${{ needs.changes.outputs.legacy }}
          UNIT: ${{ needs.unit.result }}
          RENDER: ${{ needs.render.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          python - "$UNIT" "$RENDER" "$BROWSER" <<'PY'
          import sys
          import os
          results = dict(zip(("unit", "render", "browser"), sys.argv[1:]))
          if os.environ["SCOPE"] != "success":
              sys.exit("change detection failed")
          if os.environ["LEGACY"] == "false":
              if all(result == "skipped" for result in results.values()):
                  print("legacy checks not applicable: only new-line paths changed")
                  sys.exit(0)
              sys.exit("unexpected legacy checks for new-line-only changes")
          print("; ".join(f"{name}: {result}" for name, result in results.items()))
          for name, result in results.items():
              if result != "success":
                  status = "failed" if result == "failure" else "unavailable"
                  print(f"rebuild gate: {status} ({name}: {result})")
          if all(result == "success" for result in results.values()):
              print("rebuild gate: executed (all groups)")
              sys.exit(0)
          sys.exit(1)
          PY
