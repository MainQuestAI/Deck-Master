name: Rust core and deck-tools

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deck-master-rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install material tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          python -m venv .venv
          .venv/bin/python -m pip install -e "./deck-tools[dev]"
      - name: Rust checks
        env:
          DECK_TOOLS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
      - name: File tool tests
        run: .venv/bin/python -m pytest -q deck-tools/tests --basetemp="$RUNNER_TEMP/deck-tools"
