name: Rust core and deck-tools

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deck-master-rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install material tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          python -m venv .venv
          .venv/bin/python -m pip install -e "./deck-tools[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build WebUI
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Rust checks
        env:
          DECK_TOOLS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: File tool tests
        # The runner lacks rsvg-convert/soffice; render tests run locally only.
        run: .venv/bin/python -m pytest -q deck-tools/tests -m "not render" --basetemp="$RUNNER_TEMP/deck-tools"
      - name: Install script
        run: |
          python -m pip install uv
          .venv/bin/python -m pytest -q tests/install --basetemp="$RUNNER_TEMP/install-script"
          bash scripts/install.sh --dry-run --prefix "$RUNNER_TEMP/deck-prefix" --skill-dir "$RUNNER_TEMP/codex-skills/deck"
          bash scripts/install.sh --prefix "$RUNNER_TEMP/deck-prefix" --skill-dir "$RUNNER_TEMP/codex-skills/deck"
          test -x "$RUNNER_TEMP/deck-prefix/bin/deck"
          test -x "$RUNNER_TEMP/deck-prefix/share/deck/venv/bin/python"
          "$RUNNER_TEMP/deck-prefix/share/deck/venv/bin/python" -c "import deck_tools"
          test -L "$RUNNER_TEMP/codex-skills/deck"
          test "$(readlink "$RUNNER_TEMP/codex-skills/deck")" = "${{ github.workspace }}/deck-skill"
          "$RUNNER_TEMP/deck-prefix/bin/deck" --help >/dev/null
