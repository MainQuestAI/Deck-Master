name: Rust core and deck-tools

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deck-master-rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install material tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          python -m venv .venv
          .venv/bin/python -m pip install -e "./deck-tools[dev]"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build WebUI
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Rust checks
        env:
          DECK_TOOLS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: File tool tests
        # Render tests run in the independent render job.
        run: .venv/bin/python -m pytest -q deck-tools/tests -m "not render" --basetemp="$RUNNER_TEMP/deck-tools"
      - name: Install script
        run: |
          python -m pip install uv
          .venv/bin/python -m pytest -q tests/install --basetemp="$RUNNER_TEMP/install-script"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export HOME="$(mktemp -d)"
          bash scripts/install.sh --dry-run --prefix "$RUNNER_TEMP/deck-prefix" | tee "$RUNNER_TEMP/default-plan"
          bash scripts/install.sh --prefix "$RUNNER_TEMP/deck-prefix"
          test -x "$RUNNER_TEMP/deck-prefix/bin/deck"
          test -x "$RUNNER_TEMP/deck-prefix/share/deck/current/share/deck/venv/bin/python"
          "$RUNNER_TEMP/deck-prefix/share/deck/current/share/deck/venv/bin/python" -c "import deck_tools"
          bash scripts/install.sh --prefix "$RUNNER_TEMP/deck-prefix"
          "$RUNNER_TEMP/deck-prefix/bin/deck" --help >/dev/null
          for role in deck-master deck-content deck-design deck-review; do
            test -L "$HOME/.codex/skills/$role"
            test "$(readlink "$HOME/.codex/skills/$role")" = "$RUNNER_TEMP/deck-prefix/share/deck/current/deck-skill/$role"
            test -f "$HOME/.codex/skills/$role/SKILL.md"
            test ! -L "$HOME/.codex/skills/$role/SKILL.md"
          done
          test ! -e "$HOME/.codex/skills/deck"
          test ! -L "$HOME/.codex/skills/deck"
          bash scripts/install.sh --dry-run --prefix "$RUNNER_TEMP/deck-prefix" --skills-root "$RUNNER_TEMP/skills-root" | tee "$RUNNER_TEMP/skills-root-plan"
          grep -q 'skill-entry=deck-master action=create' "$RUNNER_TEMP/skills-root-plan"
          grep -q '/deck-skill/deck-master' "$RUNNER_TEMP/skills-root-plan"
          if bash scripts/install.sh --dry-run --prefix "$RUNNER_TEMP/deck-prefix" --skill-dir "$RUNNER_TEMP/removed-deck"; then
            echo "--skill-dir 已取消，应拒绝该参数" >&2
            exit 1
          fi
          bash scripts/install.sh --prefix "$RUNNER_TEMP/deck-prefix" --skills-root "$RUNNER_TEMP/skills-root-write"
          for role in deck-master deck-content deck-design deck-review; do
            test -L "$RUNNER_TEMP/skills-root-write/$role"
            test "$(readlink "$RUNNER_TEMP/skills-root-write/$role")" = "$RUNNER_TEMP/deck-prefix/share/deck/current/deck-skill/$role"
            test -f "$RUNNER_TEMP/skills-root-write/$role/SKILL.md"
            test ! -L "$RUNNER_TEMP/skills-root-write/$role/SKILL.md"
            test -L "$RUNNER_TEMP/skills-root-write/$role/references"
            test "$(readlink "$RUNNER_TEMP/skills-root-write/$role/references")" = "../references"
            test -d "$RUNNER_TEMP/skills-root-write/$role/references"
            test -L "$RUNNER_TEMP/skills-root-write/$role/assets"
            test "$(readlink "$RUNNER_TEMP/skills-root-write/$role/assets")" = "../assets"
            test -d "$RUNNER_TEMP/skills-root-write/$role/assets"
          done
          test ! -e "$RUNNER_TEMP/skills-root-write/deck"
          test ! -L "$RUNNER_TEMP/skills-root-write/deck"

  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install render toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y librsvg2-bin libreoffice-impress poppler-utils fontconfig fonts-noto-cjk fonts-dejavu-core
          python -m venv .venv
          .venv/bin/python -m pip install -e "./deck-tools[dev]"
          rsvg-convert --version
          soffice --version
          pdftoppm -v
          fc-match 'Noto Sans CJK SC'
          git rev-parse HEAD
      - name: Real rendering tests
        run: .venv/bin/python -m pytest -q deck-tools/tests -m render --basetemp="$RUNNER_TEMP/deck-render"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-failure
          path: ${{ runner.temp }}/deck-render
