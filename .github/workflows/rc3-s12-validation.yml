name: RC3 S12 isolated engineering validation

on:
  push:
    branches:
      - codex/rc3-s12-remote-validation-20261016

permissions:
  contents: read

concurrency:
  group: rc3-s12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scoped-image-transition:
    runs-on: ubuntu-latest
    env:
      RC3_S12_EVIDENCE_ROOT: ${{ runner.temp }}/rc3-s12-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ordinary build and test dependencies
        run: |
          python -m pip install --quiet "setuptools>=77" wheel
          python -m pip install --quiet -e ".[dev]"
      - name: Check every new S12 Python target
        run: |
          python -m ruff check tools/rc3_campaign/m02_image_transition.py tests/rebuild/rc3_m02_image_fixture.py tests/rebuild/rc3_m02_image_installed_probe.py tests/rebuild/rc3_s12_evidence.py tests/rebuild/test_rc3_m02_image_transition.py
          python - <<'PY'
          from pathlib import Path
          paths = [Path("tools/rc3_campaign/m02_image_transition.py"), *Path("tests/rebuild").glob("*m02_image*.py"), Path("tests/rebuild/rc3_s12_evidence.py")]
          for path in paths:
              compile(path.read_bytes(), str(path), "exec")
          print("compiled", *map(str, paths), sep="\n")
          PY
      - name: Execute ordinary pytest and isolated own-wheel chain
        run: |
          mkdir -p "$RC3_S12_EVIDENCE_ROOT"
          python -m pytest -q -p no:cacheprovider tests/rebuild/test_rc3_m02_image_transition.py --basetemp="$RUNNER_TEMP/rc3-s12-working-tests" --junitxml="$RC3_S12_EVIDENCE_ROOT/junit.xml"
      - name: Preserve complete public neutral evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rc3-s12-engineering-${{ github.sha }}
          path: ${{ runner.temp }}/rc3-s12-evidence
          if-no-files-found: warn

