<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-blueprint-sha256="8cf79c6ada8476c72ebc13f822821a6e02d5ffa7215bfad1984c74fd52eb147c" data-author-repair-round="2" font-family="Noto Sans CJK SC" fill="#14213D" data-mechanical-adjustment="1">
  <title>p04 editable native reconstruction v3 cell-clearance repair</title>
  <desc>Fixed Page text. Native editable1600×900 SVG for13.333333333333334×7.5in conversion at0.8scale. Body30px and two explicit headings50px are retained. Layout reserves extra bottom ink clearance for observed native text shift. OriginalPNG is visual reference only.</desc>
  <rect id="canvas" x="0" y="0" width="1600" height="900" fill="#FFFFFF" />
  <text id="page-title" data-atom-id="atom:p04:title" x="50" y="94" font-size="50" font-weight="700">建议流程保留两条分支：条件可核对／条件未知</text>
  <text id="page-subtitle" data-atom-id="atom:p04:subtitle" x="50" y="131" font-size="30" font-weight="400">首次人员提交前做条件提示；能否减少后续补问仍待验证</text>

  <g id="main-chain" data-applicability="conditions-verifiable" transform="translate(0 2)">
    <rect id="main-chain-frame" x="50" y="142" width="1500" height="186" rx="12" fill="#FFFFFF" stroke="#1478FF" stroke-width="1.5" stroke-opacity="0.4" />
    <text id="main-chain-frozen-qualification" x="68" y="174" font-size="30" font-weight="700" fill="#1478FF" data-qualification-source="content_requirements.required_qualifications[0]">主链只适用于条件可核对情形。</text>
    <path id="edge-collect-retrieve" data-edge-ref="collect-retrieve" data-from="collect" data-to="retrieve" data-relationship="条件可核对后进行只读检索" d="M236 258 L612 258" fill="none" stroke="#1478FF" stroke-width="5" />
    <path id="edge-retrieve-review" data-edge-ref="retrieve-review" data-from="retrieve" data-to="review" data-relationship="资料片段与来源交人员核查" d="M612 258 L988 258" fill="none" stroke="#1478FF" stroke-width="5" />
    <path id="edge-review-submit" data-edge-ref="review-submit" data-from="review" data-to="submit" data-relationship="人工核查后仍由人员执行既有正式提交动作" d="M988 258 L1364 258" fill="none" stroke="#1478FF" stroke-width="5" />
    <polygon id="arrowhead-collect-retrieve" data-decoration-for="collect-retrieve" points="428,249 440,258 428,267" fill="#1478FF" />
    <polygon id="arrowhead-retrieve-review" data-decoration-for="retrieve-review" points="804,249 816,258 804,267" fill="#1478FF" />
    <polygon id="arrowhead-review-submit" data-decoration-for="review-submit" points="1180,249 1192,258 1180,267" fill="#1478FF" />
    <g id="node-collect">
      <rect id="collect-container" data-node-ref="collect" x="66" y="194" width="340" height="128" rx="10" fill="#FFFFFF" stroke="#1478FF" stroke-width="1.5" />
      <rect id="collect-tint" x="66" y="194" width="340" height="128" rx="10" fill="#1478FF" fill-opacity="0.06" />
      <text id="collect-label" data-atom-id="atom:p04:label:collect:text" data-node-ref="collect" x="82" y="234" font-size="30" font-weight="400"><tspan x="82" y="234">现场人员提供型号、</tspan><tspan x="82" y="267">版本与现象；接单人员</tspan><tspan x="82" y="300">核对可核查条件。</tspan></text>
    </g>
    <g id="node-retrieve">
      <rect id="retrieve-container" data-node-ref="retrieve" x="442" y="194" width="340" height="128" rx="10" fill="#FFFFFF" stroke="#1478FF" stroke-width="1.5" />
      <rect id="retrieve-tint" x="442" y="194" width="340" height="128" rx="10" fill="#1478FF" fill-opacity="0.06" />
      <text id="retrieve-label" data-atom-id="atom:p04:label:retrieve:text" data-node-ref="retrieve" x="458" y="248" font-size="30" font-weight="400"><tspan x="458" y="248">只读助手返回许可资料</tspan><tspan x="458" y="282">片段及来源。</tspan></text>
    </g>
    <g id="node-review">
      <rect id="review-container" data-node-ref="review" x="818" y="194" width="340" height="128" rx="10" fill="#FFFFFF" stroke="#1478FF" stroke-width="1.5" />
      <rect id="review-tint" x="818" y="194" width="340" height="128" rx="10" fill="#1478FF" fill-opacity="0.06" />
      <text id="review-label" data-atom-id="atom:p04:label:review:text" data-node-ref="review" x="834" y="234" font-size="30" font-weight="400"><tspan x="834" y="234">指定人员核查引用</tspan><tspan x="834" y="267">适用性，记录采用／</tspan><tspan x="834" y="300">未采用及原因。</tspan></text>
    </g>
    <g id="node-submit">
      <rect id="submit-container" data-node-ref="submit" x="1194" y="194" width="340" height="128" rx="10" fill="#FFFFFF" stroke="#1478FF" stroke-width="1.5" />
      <rect id="submit-tint" x="1194" y="194" width="340" height="128" rx="10" fill="#1478FF" fill-opacity="0.06" />
      <text id="submit-label" data-atom-id="atom:p04:label:submit:text" data-node-ref="submit" x="1210" y="248" font-size="30" font-weight="400"><tspan x="1210" y="248">人员在现有系统</tspan><tspan x="1210" y="282">完成正式提交。</tspan></text>
    </g>
  </g>

  <g id="exceptions-module">
    <text id="exceptions-heading" data-atom-id="atom:p04:block:exceptions-heading:text" x="50" y="398" font-size="50" font-weight="700">未知与不适用信息仍随请求交接</text>
    <g id="exceptions-table" data-table-id="exceptions">
      <rect id="table-background" x="50" y="424" width="1500" height="309" fill="#FFFFFF" />
      <rect id="table-header-tint" x="50" y="424" width="1500" height="59" fill="#1478FF" fill-opacity="0.1" />
      <rect id="table-border" x="50" y="424" width="1500" height="309" fill="none" stroke="#1478FF" stroke-opacity="0.45" stroke-width="1" />
      <line id="table-column-trigger-action" x1="394" y1="424" x2="394" y2="733" stroke="#1478FF" stroke-opacity="0.35" stroke-width="1" />
      <line id="table-column-action-handoff" x1="902" y1="424" x2="902" y2="733" stroke="#1478FF" stroke-opacity="0.35" stroke-width="1" />
      <line id="table-header-bottom" x1="50" y1="483" x2="1550" y2="483" stroke="#1478FF" stroke-opacity="0.45" stroke-width="1" />
      <line id="table-row-divider" x1="50" y1="608" x2="1550" y2="608" stroke="#1478FF" stroke-opacity="0.45" stroke-width="1" />
      <text id="column-trigger" data-atom-id="atom:p04:column:exceptions:trigger:label" data-column-id="trigger" x="68" y="463" font-size="30" font-weight="700">触发条件</text>
      <text id="column-action" data-atom-id="atom:p04:column:exceptions:action:label" data-column-id="action" x="412" y="463" font-size="30" font-weight="700">接单人员动作</text>
      <text id="column-handoff" data-atom-id="atom:p04:column:exceptions:handoff:label" data-column-id="handoff" x="920" y="463" font-size="30" font-weight="700">交接及继续条件</text>
      <g id="row-unknown" data-row-id="unknown">
        <text id="unknown-trigger" data-atom-id="atom:p04:cell:exceptions:unknown:trigger:display_text" data-row-id="unknown" data-column-id="trigger" x="68" y="522" font-size="30" font-weight="400"><tspan x="68" y="522">型号或版本待补／</tspan><tspan x="68" y="555">确实不可得</tspan></text>
        <text id="unknown-action" data-atom-id="atom:p04:cell:exceptions:unknown:action:display_text" data-row-id="unknown" data-column-id="action" x="412" y="522" font-size="30" font-weight="400"><tspan x="412" y="522">保留已知条件、未知字段及原因；</tspan><tspan x="412" y="555">能补则请求可核对信息，</tspan><tspan x="412" y="588">不能强制填入猜测。</tspan></text>
        <text id="unknown-handoff" data-atom-id="atom:p04:cell:exceptions:unknown:handoff:display_text" data-row-id="unknown" data-column-id="handoff" x="920" y="522" font-size="30" font-weight="400"><tspan x="920" y="522">不能补出时交指定业务核查人判断下一步；</tspan><tspan x="920" y="555">取得可核查条件后按主链继续。</tspan><tspan x="920" y="588">具体责任人与恢复规则须在启动前明确。</tspan></text>
      </g>
      <g id="row-unsuitable" data-row-id="unsuitable">
        <text id="unsuitable-trigger" data-atom-id="atom:p04:cell:exceptions:unsuitable:trigger:display_text" data-row-id="unsuitable" data-column-id="trigger" x="68" y="647" font-size="30" font-weight="400"><tspan x="68" y="647">引用适用性无法确认、</tspan><tspan x="68" y="680">引用冲突／不适用，</tspan><tspan x="68" y="713">或问题仍不确定</tspan></text>
        <text id="unsuitable-action" data-atom-id="atom:p04:cell:exceptions:unsuitable:action:display_text" data-row-id="unsuitable" data-column-id="action" x="412" y="647" font-size="30" font-weight="400"><tspan x="412" y="647">保留设备条件、来源位置</tspan><tspan x="412" y="680">和未决点；候选引用不能标成</tspan><tspan x="412" y="713">可直接采用的结论。</tspan></text>
        <text id="unsuitable-handoff" data-atom-id="atom:p04:cell:exceptions:unsuitable:handoff:display_text" data-row-id="unsuitable" data-column-id="handoff" x="920" y="647" font-size="30" font-weight="400"><tspan x="920" y="647">交核查人确认资料适用性和下一步；</tspan><tspan x="920" y="680">无法确认则继续标明未决，</tspan><tspan x="920" y="713">不把找到资料记为故障已解决。</tspan></text>
      </g>
    </g>
  </g>

  <g id="boundary-module">
    <rect id="boundary-background" x="50" y="759" width="1500" height="91" rx="12" fill="#1478FF" fill-opacity="0.06" stroke="#1478FF" stroke-width="1.5" />
    <text id="boundary-text" data-atom-id="atom:p04:callout:boundary:text" x="68" y="798" font-size="30" font-weight="400"><tspan x="68" y="798">原始范围：AI 不自动提交、修改或关闭正式工单，未知及原因必须保留。</tspan><tspan x="68" y="830">能力边界：引用问答不等于诊断正确或操作获批。</tspan></text>
  </g>
</svg>