[package]
name = "deck"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
