[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-tools"
version = "1.1.4"
description = "Standalone file tools for Deck Master"
requires-python = ">=3.11,<3.14"
dependencies = ["python-pptx>=1.0", "Pillow>=10", "lxml>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["deck_tools.vendor*"]

[tool.setuptools.package-data]
deck_tools = [
  "resources/icons/lucide/*",
  "resources/icons/tabler-outline/*",
  "vendor/cyberppt/LICENSE",
  "vendor/cyberppt/SOURCE.md",
  "vendor/cyberppt/select_icon.py",
]

[tool.pytest.ini_options]
markers = ["render: real local rendering tools"]
