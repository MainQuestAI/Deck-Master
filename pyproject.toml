[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-master"
version = "1.0.0"
description = "Local-first deck workbench with recoverable host tasks, native SVG/PPT production, independent review, and delivery."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [
  { name = "MainQuest AI" }
]
dependencies = [
  "jsonschema>=4.23,<5",
  "python-pptx>=0.6.21",
  "Pillow>=10,<13",
  "numpy>=1.26,<3"
]

[project.optional-dependencies]
dev = [
  "setuptools>=77",
  "wheel",
  "coverage",
  "playwright",
  "pytest",
  "ruff"
]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# The installed command and source-checkout module share the rebuilt core.
[project.scripts]
deck-master = "deck_master.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deck_master = [
  "resources/contracts/*.json",
  "resources/icons/lucide/*",
  "resources/compiler/*.mjs",
  "resources/static/v2/*",
  "resources/static/studio/*",
  "resources/static/v2/assets/deck-master-logo/*",
]

[tool.pytest.ini_options]
markers = [
    "render: tests that need the real renderer toolchain (soffice/pdftoppm/rsvg-convert)",
    "browser: tests that execute the shipped UI in a real Chromium browser",
]
