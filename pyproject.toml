[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-master"
version = "1.0.0.dev1"
description = "Rebuilt Deck Master core: immutable storage, host-task envelopes, native SVG compiler, and read-only workbench."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "MainQuest AI" }
]
dependencies = [
  "jsonschema>=4.23,<5",
  "python-pptx>=0.6.21",
  "Pillow>=10,<13",
  "numpy>=1.26,<3"
]

[project.optional-dependencies]
dev = [
  "coverage",
  "playwright",
  "pytest",
  "ruff"
]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# Console entry stays switched off until T17 (spec 01.1: the new core runs via
# `python -m deck_master` in an isolated environment during WP01–WP03).
# [project.scripts]
# deck-master = "deck_master.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deck_master = [
  "resources/contracts/*.json",
  "resources/static/*",
  "resources/skills-references/*.md",
]
